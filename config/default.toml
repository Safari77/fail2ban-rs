# Reference: https://github.com/aejimmi/fail2ban-rs

[global]
state_file = "/var/lib/fail2ban-rs/state.bin"
socket_path = "/var/run/fail2ban-rs/fail2ban-rs.sock"

# Logging — stderr is captured by systemd-journald. Each line carries the
# whole payload (event phrase + structured fields). Under systemd a `<N>`
# priority prefix is added so journalctl colors and `journalctl -p err`
# work correctly.
#
# [logging]
# level = "info"      # severity filter: debug | info | warn | error
# format = "logfmt"   # default — human-readable: banned ip=1.2.3.4 jail=sshd
# format = "json"     # structured: {"msg":"banned","ip":"1.2.3.4","jail":"sshd"}

[jail.sshd]
enabled = true
log_path = "/var/log/auth.log"
date_format = "syslog"
filter = [
    'sshd\[\d+\]: Failed password for .* from <HOST>',
    'sshd\[\d+\]: Invalid user .* from <HOST>',
    'sshd\[\d+\]: Connection closed by authenticating user .* <HOST>',
]
port = ["22"]
protocol = "tcp"
max_retry = 5
find_time = "10m"
ban_time = "1h"
# Firewall backend: "nftables", "iptables", "ipset", or a script table.
# "ipset" keeps bans in a kernel hash set — O(1) lookups on long ban lists —
# and needs the ipset tool plus the ip_set, ip_set_hash_ip and xt_set modules.
backend = "nftables"

# To tune ipset, replace the backend line above with a table placed AFTER every
# other key in this jail — a TOML sub-table captures all keys that follow it:
#   [jail.sshd.backend.ipset]
#   maxelem = 65536   # max entries per set; bans past this are refused
#   chain = "INPUT"   # use "DOCKER-USER" to also cover published container ports

# Ban time escalation for repeat offenders
bantime_increment = true
bantime_multipliers = [1, 2, 4, 8, 16, 32, 64]
bantime_maxtime = "1w"

# IPs/CIDRs to never ban
ignoreip = ["127.0.0.1/8", "::1/128"]
ignoreself = true
